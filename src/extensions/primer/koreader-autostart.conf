# Start KOReader once per boot, after the Kindle framework is up.
# Installed to /etc/upstart from KUAL > Primer or Primer's Settings. Skipped when /mnt/us/NO_KOREADER exists.

description "Start KOReader at boot"

start on framework_ready
task

script
	# framework_ready fires again every time KOReader exits and restarts the
	# framework, so only launch once per boot. Exiting (or a crash) then lands
	# in the stock Kindle UI instead of looping back into KOReader.
	FLAG=/tmp/koreader-autostart.boot
	BOOT_ID="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null)"
	[ -n "$BOOT_ID" ] && [ "$(cat "$FLAG" 2>/dev/null)" = "$BOOT_ID" ] && exit 0
	echo "$BOOT_ID" > "$FLAG"

	[ -e /mnt/us/NO_KOREADER ] && exit 0
	[ -f /mnt/us/koreader/koreader.sh ] || exit 0

	# How to start KOReader. Older firmware: stop the Kindle framework while KOReader runs and
	# restart it on exit. Firmware 5.16.3+ (the hdnext stack, with KPM in /var/local/kmc) doesn't
	# survive that restart (the home screen never comes back), so there KOReader runs over the
	# framework the way KPM's own launcher does (--asap), after giving the home screen a moment.
	MODE="--framework_stop"
	if [ -d /var/local/kmc ]; then
		MODE="--asap"
		sleep 3
	fi

	# Detach so upstart doesn't own KOReader's lifetime.
	cd /
	if command -v setsid >/dev/null 2>&1; then
		setsid /bin/sh /mnt/us/koreader/koreader.sh $MODE </dev/null >/dev/null 2>&1 &
	else
		/bin/sh /mnt/us/koreader/koreader.sh $MODE </dev/null >/dev/null 2>&1 &
	fi
end script
